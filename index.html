<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#111723"><link rel="manifest" href="./manifest.json">
<title>まさなりクエスト 不思議の野球部</title>
<style>
body{margin:0;background:#070a10;color:white;font-family:system-ui,sans-serif;display:flex;justify-content:center}
#app{width:min(900px,100%);padding:8px;box-sizing:border-box}
h1{text-align:center;font-size:22px;margin:4px}
canvas{display:block;width:100%;height:auto;border:2px solid #68748b;border-radius:10px;background:#090c12;touch-action:none}
#controls{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;margin-top:7px}
button{padding:12px 2px;border-radius:8px;border:1px solid #70809d;background:#1b2943;color:white;font-weight:bold;font-size:17px}
button:active{background:#405578}
#log{height:82px;overflow:auto;background:#090c13;border:1px solid #30394d;border-radius:8px;margin-top:7px;padding:6px;font-size:12px;line-height:1.5}
#hint{text-align:center;color:#9ba8bd;font-size:11px;margin:5px}
</style>
</head>
<body><div id="app">
<h1>まさなりクエスト ― 不思議の野球部 ―</h1>
<canvas id="game" width="800" height="560"></canvas>
<div id="controls"></div><div id="log"></div>
<div id="hint">矢印キー / WASDで移動　・　敵の隣へ進むと攻撃</div>
</div>
<script>
"use strict";
const c=document.getElementById("game"),x=c.getContext("2d"),log=document.getElementById("log"),controls=document.getElementById("controls");
const W=800,H=560,COLS=20,ROWS=13,T=40;
let map,seen,enemies,items,player,state,floor,hp,maxHp,lv,exp,atk,def,hunger,gold,shake=0;
const R=n=>Math.floor(Math.random()*n), clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function msg(s){let d=document.createElement("div");d.textContent=s;log.appendChild(d);log.scrollTop=log.scrollHeight}
function fill(col){x.fillStyle=col} function box(a,b,w,h,col){fill(col);x.fillRect(a,b,w,h)}
function circ(a,b,r,col){fill(col);x.beginPath();x.arc(a,b,r,0,Math.PI*2);x.fill()}
function txt(s,a,b,z,col="#fff",align="left",weight="400"){x.font=weight+" "+z+"px system-ui,sans-serif";x.fillStyle=col;x.textAlign=align;x.fillText(s,a,b)}
function makeMap(){
 map=Array.from({length:ROWS},()=>Array(COLS).fill(1));let a=1,b=1;map[b][a]=0;
 for(let i=0;i<240;i++){let d=R(4);if(d===0)a++;if(d===1)a--;if(d===2)b++;if(d===3)b--;a=clamp(a,1,COLS-2);b=clamp(b,1,ROWS-2);map[b][a]=0}
 for(let q=0;q<8;q++){let rx=1+R(15),ry=1+R(8),rw=3+R(4),rh=2+R(3);for(let yy=ry;yy<Math.min(12,ry+rh);yy++)for(let xx=rx;xx<Math.min(19,rx+rw);xx++)map[yy][xx]=0}
}
function occupied(a,b){return enemies.some(e=>e.x===a&&e.y===b)||items.some(i=>i.x===a&&i.y===b)}
function free(){for(let i=0;i<500;i++){let a=1+R(18),b=1+R(11);if(map[b][a]===0&&!occupied(a,b)&&!(a===player.x&&b===player.y))return{x:a,y:b}}return{x:18,y:11}}
function setup(){
 makeMap();seen=Array.from({length:ROWS},()=>Array(COLS).fill(false));enemies=[];items=[];
 let s;outer:for(let b=1;b<12;b++)for(let a=1;a<19;a++)if(map[b][a]===0){s={x:a,y:b};break outer}
 player=s||{x:1,y:1};reveal();
 let q=free();items.push({x:q.x,y:q.y,type:"stairs"});
 const types=["bat","drink","rice","shoes","megaphone"];
 for(let i=0;i<6;i++){q=free();items.push({x:q.x,y:q.y,type:types[R(types.length)]})}
 let count=5+Math.min(5,Math.floor(floor/2));
 for(let i=0;i<count;i++){q=free();let name="部員",boss=false;
  if(floor===5&&i===0){name="かなた";boss=true}
  if(floor===8&&i===0){name="佐藤さん";boss=true}
  if(floor===12&&i===0){name="まさなり";boss=true}
  let mh=boss?180+floor*18:24+floor*7;enemies.push({x:q.x,y:q.y,name,boss,hp:mh,maxHp:mh,attack:boss?20+floor:5+floor})
 }
 msg("◆ "+floor+"F　探索開始"); 
}
function reveal(){for(let b=0;b<ROWS;b++)for(let a=0;a<COLS;a++){let dx=a-player.x,dy=b-player.y;if(dx*dx/25+dy*dy/16<2)seen[b][a]=true}}
function shadow(a,b,r=12){x.globalAlpha=.3;circ(a,b+11,r,"#000");x.globalAlpha=1}
function playerArt(a,b){
 shadow(a,b);box(a-9,b+2,7,13,"#172235");box(a+2,b+2,7,13,"#172235");
 box(a-12,b-7,24,18,"#e8e6df");box(a-12,b-7,4,18,"#315687");
 box(a-17,b-4,7,13,"#d09a73");box(a+10,b-4,7,13,"#d09a73");
 circ(a,b-16,10,"#d5a078");fill("#15191f");x.beginPath();x.arc(a,b-20,11,Math.PI,Math.PI*2);x.fill();
 fill("#183a68");x.beginPath();x.arc(a,b-25,10,Math.PI,Math.PI*2);x.fill();box(a-12,b-25,24,4,"#183a68");
 circ(a-4,b-16,1.3,"#111");circ(a+4,b-16,1.3,"#111");txt("S",a,b+4,8,"#315887","center","800")
}
function kanata(a,b){
 shadow(a,b,14);box(a-9,b+2,7,14,"#252c39");box(a+2,b+2,7,14,"#252c39");box(a-14,b-7,28,19,"#c8cbd0");
 circ(a,b-17,12,"#b97b58");fill("#3a251b");x.beginPath();x.arc(a,b-20,12,Math.PI,Math.PI*2);x.fill();
 box(a-8,b-20,5,2,"#28150e");box(a+3,b-20,5,2,"#28150e");circ(a-4,b-15,1.5,"#111");circ(a+4,b-15,1.5,"#111");
 x.strokeStyle="#542019";x.lineWidth=2;x.beginPath();x.arc(a,b-12,5,0,Math.PI);x.stroke();
 box(a+12,b-2,9,13,"#f1d29a")
}
function sato(a,b){
 shadow(a,b,16);box(a-12,b+2,9,15,"#252b31");box(a+3,b+2,9,15,"#252b31");box(a-16,b-7,32,20,"#303842");
 circ(a,b-19,14,"#b77c59");fill("#14171b");x.beginPath();x.arc(a,b-21,14,Math.PI,Math.PI*2);x.fill();
 box(a-15,b-24,30,5,"#10141b");box(a-20,b-21,25,4,"#10141b");
 x.strokeStyle="#17110e";x.lineWidth=3;x.beginPath();x.moveTo(a-9,b-19);x.lineTo(a-2,b-16);x.moveTo(a+9,b-19);x.lineTo(a+2,b-16);x.stroke();
 circ(a-5,b-13,1.6,"#111");circ(a+5,b-13,1.6,"#111");
 x.strokeStyle="#c73b46";x.lineWidth=2;x.beginPath();x.moveTo(a+14,b-28);x.lineTo(a+20,b-34);x.moveTo(a+20,b-27);x.lineTo(a+25,b-31);x.stroke()
}
function masanari(a,b){
 shadow(a,b,23);fill("#641f2a");x.beginPath();x.moveTo(a-25,b+20);x.lineTo(a-18,b-8);x.lineTo(a,b-19);x.lineTo(a+18,b-8);x.lineTo(a+25,b+20);x.closePath();x.fill();
 box(a-18,b-4,36,28,"#202630");circ(a,b-20,15,"#c88b64");
 fill("#11151b");x.beginPath();x.arc(a,b-24,16,Math.PI,Math.PI*2);x.fill();box(a-18,b-30,36,6,"#111827");box(a-25,b-25,29,5,"#0b1220");
 txt("S",a,b-27,10,"#d4a84e","center","900");box(a-9,b-21,7,2,"#16100e");box(a+2,b-21,7,2,"#16100e");
 x.save();x.translate(a+21,b+5);x.rotate(-.65);box(-3,-27,6,35,"#bd8149");box(-5,-34,10,12,"#e2c78e");x.restore()
}
function enemy(a,b){shadow(a,b);box(a-9,b,7,13,"#303746");box(a+2,b,7,13,"#303746");box(a-12,b-7,24,17,"#8c3f4d");circ(a,b-16,10,"#b87b59");fill("#24252b");x.beginPath();x.arc(a,b-18,10,Math.PI,Math.PI*2);x.fill();circ(a-3,b-15,1.2,"#111");circ(a+3,b-15,1.2,"#111")}
function item(type,a,b){
 shadow(a,b,10);
 if(type==="bat"){x.save();x.translate(a,b);x.rotate(-.55);box(-3,-17,6,28,"#b77945");box(-6,-23,12,9,"#d4a46a");x.restore()}
 else if(type==="drink"){box(a-8,b-11,16,23,"#5c9dd1");box(a-5,b-15,10,5,"#dce4ec");box(a-6,b-3,12,3,"#eaf5ff")}
 else if(type==="rice"){fill("#eeeae0");x.beginPath();x.moveTo(a-11,b-6);x.lineTo(a,b-14);x.lineTo(a+11,b-6);x.lineTo(a+7,b+10);x.lineTo(a-7,b+10);x.closePath();x.fill();box(a-3,b-2,6,9,"#252d3c")}
 else if(type==="shoes"){fill("#e3e3df");x.beginPath();x.roundRect(a-14,b-5,28,12,5);x.fill();box(a-3,b-9,8,7,"#293e68")}
 else{fill("#e0c15b");x.beginPath();x.moveTo(a-12,b-11);x.lineTo(a+10,b-7);x.lineTo(a+7,b+10);x.lineTo(a-10,b+6);x.closePath();x.fill();box(a-5,b-3,10,3,"#7b2731")}
}
function stairs(a,b){x.strokeStyle="#6fc0e2";x.lineWidth=3;for(let i=0;i<3;i++){x.beginPath();x.moveTo(a-12+i*3,b+8-i*6);x.lineTo(a+12-i*3,b+8-i*6);x.stroke()}}
function draw(){
 x.save();if(shake){x.translate(R(7)-3,R(7)-3);shake--}box(0,0,W,H,"#070a10");
 let ox=(W-COLS*T)/2;
 for(let b=0;b<ROWS;b++)for(let a=0;a<COLS;a++){
  if(!seen[b][a]){box(ox+a*T,b*T,T,T,"#05070b");continue}
  if(map[b][a]){box(ox+a*T,b*T,T,T,"#111723");box(ox+a*T+3,b*T+3,T-6,T-6,"#1c2635");box(ox+a*T+6,b*T+6,T-12,5,"#2a3547")}
  else{let g=x.createLinearGradient(0,b*T,0,b*T+T);g.addColorStop(0,"#57534b");g.addColorStop(1,"#373832");x.fillStyle=g;x.fillRect(ox+a*T,b*T,T,T);x.strokeStyle="#625e55";x.strokeRect(ox+a*T,b*T,T,T)}
 }
 for(let b=0;b<ROWS;b++)for(let a=0;a<COLS;a++)if(seen[b][a]){let d=Math.hypot(a-player.x,b-player.y);if(d>3.2){box(ox+a*T,b*T,T,T,"rgba(3,6,11,"+Math.min(.7,(d-3.2)*.18)+")")}}
 for(const it of items)if(seen[it.y][it.x]){let a=ox+it.x*T+20,b=it.y*T+20;if(it.type==="stairs")stairs(a,b);else item(it.type,a,b)}
 for(const e of enemies)if(seen[e.y][e.x]){let a=ox+e.x*T+20,b=e.y*T+20;if(e.name==="かなた")kanata(a,b);else if(e.name==="佐藤さん")sato(a,b);else if(e.name==="まさなり")masanari(a,b);else enemy(a,b);if(e.boss){box(a-17,b-27,34,5,"#24151a");box(a-17,b-27,34*e.hp/e.maxHp,5,"#d94b5d")}}
 playerArt(ox+player.x*T+20,player.y*T+20);
 box(0,520,W,40,"#080b12");txt("FLOOR "+floor+"/12",14,545,13,"#b9c5d9","left","800");txt("LV "+lv,112,545,13,"#d7ddea","left","700");
 txt("HP "+hp+"/"+maxHp,165,545,13,"#f0d7d7","left","700");box(255,536,120,8,"#252b38");box(255,536,120*clamp(hp/maxHp,0,1),8,"#55bd7a");
 txt("満腹 "+hunger,392,545,13,"#b8c9dc","left","700");txt("攻 "+atk+"　防 "+def,485,545,13,"#d8d1ba","left","700");txt(gold+" G",710,545,13,"#e1bd61","left","800");
 x.restore()
}
function isFloor(a,b){return a>=0&&a<COLS&&b>=0&&b<ROWS&&map[b][a]===0}
function move(dx,dy){
 if(state!=="play")return;let a=player.x+dx,b=player.y+dy;if(!isFloor(a,b))return;
 let e=enemies.find(e=>e.x===a&&e.y===b);if(e){attackEnemy(e);return}
 player.x=a;player.y=b;reveal();pickup();if(state==="play")enemyTurn();draw()
}
function pickup(){
 let i=items.findIndex(q=>q.x===player.x&&q.y===player.y);if(i<0)return;let it=items[i];items.splice(i,1);
 if(it.type==="stairs"){if(floor===12){win();return}floor++;setup();return}
 if(it.type==="drink"){hp=Math.min(maxHp,hp+32);msg("スポーツドリンク。HPが回復した。")}
 if(it.type==="rice"){hunger=Math.min(100,hunger+42);msg("おにぎり。満腹度が回復した。")}
 if(it.type==="bat"){atk+=7;msg("金属バットを装備。攻撃力+7。")}
 if(it.type==="shoes"){def+=2;msg("スパイクを装備。防御力+2。")}
 if(it.type==="megaphone"){atk+=8;msg("応援メガホン。攻撃力+8。")}
}
function attackEnemy(e){let d=atk+R(8);e.hp-=d;shake=5;msg(e.name+"に "+d+" ダメージ！");
 if(e.hp<=0){enemies=enemies.filter(q=>q!==e);gold+=e.boss?100:10+R(11);exp+=e.boss?75:12;msg(e.name+"を倒した！");
  if(exp>=lv*40){exp=0;lv++;maxHp+=15;hp=maxHp;atk+=3;msg("レベル "+lv+" に上がった！")}}
 else enemyTurn();draw()
}
function enemyTurn(){
 for(const e of enemies){let d=Math.abs(e.x-player.x)+Math.abs(e.y-player.y);
  if(d===1){let z=Math.max(1,e.attack-def+R(4));hp-=z;shake=5;msg(e.name+"の攻撃！ "+z+" ダメージ。");if(e.name==="佐藤さん")msg("「やる気ないなら帰っていいよ！」");continue}
  if(d<=7){let dx=Math.sign(player.x-e.x),dy=Math.sign(player.y-e.y),cs=Math.random()<.5?[[e.x+dx,e.y],[e.x,e.y+dy]]:[[e.x,e.y+dy],[e.x+dx,e.y]];
   for(const q of cs)if(isFloor(q[0],q[1])&&!(q[0]===player.x&&q[1]===player.y)&&!enemies.some(o=>o!==e&&o.x===q[0]&&o.y===q[1])){e.x=q[0];e.y=q[1];break}}
 }
 hunger--;if(hunger<=0){hunger=0;hp--;msg("満腹度が0。HPが減った。")}
 if(hp<=0){hp=0;state="dead";makeControls();msg("力尽きた……")}
}
function wait(){if(state==="play"){msg("待機した。");enemyTurn();draw()}}
function makeControls(){controls.innerHTML="";
 if(state==="play"){[["↑",()=>move(0,-1)],["←",()=>move(-1,0)],["待機",wait],["→",()=>move(1,0)],["↓",()=>move(0,1)]].forEach(q=>{let b=document.createElement("button");b.textContent=q[0];b.onclick=q[1];controls.appendChild(b)})}
 else{let b=document.createElement("button");b.textContent="もう一度プレイ";b.onclick=start;controls.appendChild(b)}
}
function win(){state="win";makeControls();box(0,0,W,H,"#080c14");txt("CLEAR",400,190,60,"#e6c56b","center","900");txt("まさなりを倒した！",400,245,27,"#fff","center","800");txt("不思議の野球部・完全攻略",400,286,18,"#b8c5db","center","600");txt("グラウンドの頂点に立った。",400,330,16,"#dfe5ef","center","500");msg("ゲームクリア！")}
function start(){hp=maxHp=100;lv=1;exp=0;atk=12;def=2;hunger=100;gold=0;floor=1;state="play";log.innerHTML="";setup();makeControls();msg("12Fのまさなりを目指せ！");draw()}

// === USER PORTRAITS ===
const userPortraits = {
 player: "data:image/jpeg;base64," + custom_player,
 sato: "data:image/jpeg;base64," + custom_sato,
 masanari: "data:image/jpeg;base64," + custom_masanari,
 kanata: "data:image/jpeg;base64," + custom_kanata
};
for (const k of Object.keys(userPortraits)) {
  imgs[k] = new Image();
  imgs[k].src = userPortraits[k];
  imgs[k].onload = () => { if (typeof draw === "function") draw(); };
}
// Replace the generated character drawings with the supplied portraits.
function portrait(name,cx,cy,size,frame=false){
  const im = imgs[name];
  if (!im || !im.complete || !im.naturalWidth) return;
  x.save();
  x.beginPath();
  x.arc(cx,cy,size/2,0,Math.PI*2);
  x.clip();
  x.drawImage(im,cx-size/2,cy-size/2,size,size);
  x.restore();
  if(frame){
    x.strokeStyle="#d8b85d"; x.lineWidth=3;
    x.beginPath(); x.arc(cx,cy,size/2+2,0,Math.PI*2); x.stroke();
  }
}
function smallChar(name,a,b){
  circ(a,b+12,13,"rgba(0,0,0,.42)");
  box(a-15,b-17,30,31,"#182131");
  portrait(name,a,b-9,29,true);
}
function playerArt(a,b){ smallChar("player",a,b); }
function kanata(a,b){ smallChar("kanata",a,b); }
function sato(a,b){ smallChar("sato",a,b); }
function masanari(a,b){ 
  circ(a,b+17,22,"rgba(0,0,0,.48)");
  portrait("masanari",a,b-4,48,true);
}

start();
